# Application properties
application-description=@project.description@
application-version=@project.version@

# Database Configuration - Render provides DATABASE_URL
spring.datasource.url=${DATABASE_URL}

# Connection Pooling
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# Server Configuration - Render provides PORT
server.port=${PORT:8080}

# Hibernate Properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Spring Custom properties
spring.jpa.open-in-view=false
spring.mvc.log-request-details=true

# Spring DOC (Swagger)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

## Security Data
jwt.secret=${JWT_SECRET}
jwt.accessTokenDuration=${JWT_ACCESS_TOKEN_DURATION:7200000}
jwt.refreshTokenDuration=${JWT_REFRESH_TOKEN_DURATION:7776000000}
jwt.accessTokenCookieName=accessToken
jwt.refreshTokenCookieName=refreshToken

# Logging
logging.config=classpath:log4j2-spring.xml
logging.level.root=INFO
logging.level.com.pete.bibliogere=INFO

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized